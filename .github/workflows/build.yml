on:
  push:
    branches:
      - master
      - 'm*'
    paths:
      - ".github/workflows/*"
      - "script/*"
      - "patches/*"
  workflow_dispatch:
    inputs:
      skip_release:
        description: 'Skip release related steps? (true/false)'
        required: true
        default: 'false'

permissions:
  contents: write

env:
  version: m143-da51f0d60e-4

jobs:
  scripts:
    strategy:
      matrix:
        os: [ubuntu-22.04, macos-14, windows-latest]
      fail-fast: false
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - run: python3 script/test_gn_args.py

  macos:
    # No compiler axis: Apple Clang is the default compiler here already.
    runs-on: macos-14
    strategy:
      matrix:
        machine: ["x64", "arm64"]
        build_type: [Release, Debug]
      fail-fast: false
    steps:
      - uses: actions/checkout@v4
      - run: python3 script/check_release.py --version ${{ env.version }} --build-type ${{ matrix.build_type }} --machine ${{ matrix.machine }}
        if: ${{ github.event.inputs.skip_release != 'true' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: abdes/gha-setup-ninja@660f330a40aefa8d11632b3f901e92a4adb33d65
      - run: python3 script/checkout.py --version ${{ env.version }}
      - run: python3 script/build.py --build-type ${{ matrix.build_type }} --machine ${{ matrix.machine }}
      - run: python3 script/archive.py --version ${{ env.version }} --build-type ${{ matrix.build_type }} --machine ${{ matrix.machine }}
      - uses: actions/upload-artifact@v4
        with:
          name: Skia-${{ env.version }}-macos-${{ matrix.build_type }}-${{ matrix.machine }}.zip
          path: '*.zip'
      - run: python3 script/release.py --version ${{ env.version }} --build-type ${{ matrix.build_type }} --machine ${{ matrix.machine }}
        if: ${{ github.event.inputs.skip_release != 'true' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  linux:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        target_machine: ["x64", "arm64"]
        build_type: [Release, Debug]
        # Release is built twice: once with the platform default compiler and
        # once with Clang/LLVM, so both sets of artifacts land in one run. Debug
        # is only built with the default compiler.
        compiler: [default, clang]
        exclude:
          - compiler: clang
            build_type: Debug
        include:
          - compiler: default
            use_clang: false
            classifier: ""
            suffix: ""
          - compiler: clang
            use_clang: true
            classifier: "clang"
            suffix: "-clang"
      fail-fast: false
    steps:
      - uses: actions/checkout@v4
      - run: python3 script/check_release.py --version ${{ env.version }} --build-type ${{ matrix.build_type }} --machine ${{ matrix.target_machine }} --classifier "${{ matrix.classifier }}"
        if: ${{ github.event.inputs.skip_release != 'true' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: abdes/gha-setup-ninja@660f330a40aefa8d11632b3f901e92a4adb33d65
      - run: sudo ./script/prepare_linux.sh ${{ matrix.use_clang && '--with-clang' || '' }}
      - run: |
          sudo apt-get update
          sudo apt-get --yes install g++-9-aarch64-linux-gnu
        if: ${{ matrix.target_machine == 'arm64' }}
      - run: PATH=/usr/lib/binutils-2.26/bin:$PATH python3 script/checkout.py --version ${{ env.version }}
      - run: PATH=/usr/lib/binutils-2.26/bin:$PATH python3 script/build.py --build-type ${{ matrix.build_type }} --machine ${{ matrix.target_machine }} --use-clang ${{ matrix.use_clang }}
      - run: PATH=/usr/lib/binutils-2.26/bin:$PATH python3 script/archive.py --version ${{ env.version }} --build-type ${{ matrix.build_type }} --machine ${{ matrix.target_machine }} --classifier "${{ matrix.classifier }}"
      - uses: actions/upload-artifact@v4
        with:
          name: Skia-${{ env.version }}-linux-${{ matrix.build_type }}-${{ matrix.target_machine }}${{ matrix.suffix }}.zip
          path: '*.zip'
      - run: python3 script/release.py --version ${{ env.version }} --build-type ${{ matrix.build_type }} --machine ${{ matrix.target_machine }} --classifier "${{ matrix.classifier }}"
        if: ${{ github.event.inputs.skip_release != 'true' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  windows:
    strategy:
      matrix:
        os: [ windows-latest, windows-11-arm ]
        build_type: [ Release, Debug ]
        # Release is built twice: once with the platform default compiler and
        # once with Clang/LLVM, so both sets of artifacts land in one run. Debug
        # is only built with the default compiler.
        compiler: [default, clang]
        exclude:
          - compiler: clang
            build_type: Debug
        include:
          - compiler: default
            use_clang: false
            classifier: ""
            suffix: ""
          - compiler: clang
            use_clang: true
            classifier: "clang"
            suffix: "-clang"
      fail-fast: false
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - shell: bash
        run: python3 script/check_release.py --version ${{ env.version }} --build-type ${{ matrix.build_type }} --classifier "${{ matrix.classifier }}"
        if: ${{ github.event.inputs.skip_release != 'true' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: |
          ninja --version
          $os_arch = "${{ runner.arch }}".ToLower()
          echo "os_arch=$os_arch" >> $env:GITHUB_ENV
      - uses: microsoft/setup-msbuild@v3
        with:
          msbuild-architecture: ${{ env.os_arch }}
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ env.os_arch }}
      - name: Install LLVM if the image does not ship one
        if: ${{ matrix.use_clang }}
        run: |
          if (-not (Get-Command clang-cl -ErrorAction SilentlyContinue) -and
              -not (Test-Path "$env:ProgramFiles/LLVM/bin/clang-cl.exe")) {
            choco install llvm --yes --no-progress
          }
      - shell: bash
        run: python3 script/checkout.py --version ${{ env.version }}
      - shell: bash
        run: python3 script/build.py --build-type ${{ matrix.build_type }} --use-clang ${{ matrix.use_clang }}
      - shell: bash
        run: python3 script/archive.py --version ${{ env.version }} --build-type ${{ matrix.build_type }} --classifier "${{ matrix.classifier }}"
      - uses: actions/upload-artifact@v7
        with:
          name: Skia-${{ env.version }}-windows-${{ matrix.build_type }}-${{ env.os_arch }}${{ matrix.suffix }}.zip
          path: '*.zip'
      - shell: bash
        run: python3 script/release.py --version ${{ env.version }} --build-type ${{ matrix.build_type }} --classifier "${{ matrix.classifier }}"
        if: ${{ github.event.inputs.skip_release != 'true' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  android:
    # No compiler axis: the NDK ships its own Clang.
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        target_machine: ["arm64", "x64"]
        build_type: [Release, Debug]
      fail-fast: false
    steps:
      - uses: actions/checkout@v4
      - run: python3 script/check_release.py --version ${{ env.version }} --build-type ${{ matrix.build_type }} --machine ${{ matrix.target_machine }} --system android
        if: ${{ github.event.inputs.skip_release != 'true' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: abdes/gha-setup-ninja@660f330a40aefa8d11632b3f901e92a4adb33d65
      - run: |
          sudo apt-get update
          sudo apt-get --yes install openjdk-11-jdk
          wget https://dl.google.com/android/repository/commandlinetools-linux-8512546_latest.zip -O cmdline-tools.zip
          unzip cmdline-tools.zip
          sudo mkdir -p /opt/android-sdk/cmdline-tools/latest
          sudo mv cmdline-tools/* /opt/android-sdk/cmdline-tools/latest/
          sudo chown -R $USER:$USER /opt/android-sdk
          echo "y" | /opt/android-sdk/cmdline-tools/latest/bin/sdkmanager "platforms;android-33" "build-tools;33.0.0" "ndk;25.1.8937393"
      - run: python3 script/checkout.py --version ${{ env.version }} --system android --machine ${{ matrix.target_machine }}
      - run: python3 script/build.py --version ${{ env.version }} --build-type ${{ matrix.build_type }} --machine ${{ matrix.target_machine }} --system android --ndk /opt/android-sdk/ndk/25.1.8937393
      - run: python3 script/archive.py --version ${{ env.version }} --build-type ${{ matrix.build_type }} --machine ${{ matrix.target_machine }} --system android
      - uses: actions/upload-artifact@v4
        with:
          name: Skia-${{ env.version }}-android-${{ matrix.build_type }}-${{ matrix.target_machine }}.zip
          path: '*.zip'
      - run: python3 script/release.py --version ${{ env.version }} --build-type ${{ matrix.build_type }} --machine ${{ matrix.target_machine }} --system android
        if: ${{ github.event.inputs.skip_release != 'true' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
